- endpoint: {{.MC_OBO}}
  {{if ne .HC_PLATFORM "aws"}}token: {{.MC_PROMETHEUS_TOKEN}}{{end}}
  metrics:
    - metrics-profiles/{{.HC_PRODUCT}}/hosted-cp-metrics.yml
  alerts:
    - alerts-profiles/{{.HC_PRODUCT}}/hosted-cp-alerts.yml
  indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
- endpoint: {{.MC_PROMETHEUS}}
  {{if .MC_PROMETHEUS_TOKEN_FILE}}tokenFile: {{.MC_PROMETHEUS_TOKEN_FILE}}{{else}}token: {{.MC_PROMETHEUS_TOKEN}}{{end}}
  metrics:
    - metrics-profiles/{{.HC_PRODUCT}}/mc-metrics.yml
  indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
# HOSTED_PROMETHEUS is skipped for GCP HCP because it does not expose Prometheus routes/ingress yet.
# Workload metrics (podLatency, pprof, job summaries) are still collected without this.
# Remove the platform condition once HC ingress/routes are available for GCP HCP.
{{- if ne .HC_PLATFORM "gcp" }}
- endpoint: {{.HOSTED_PROMETHEUS}}
  token: {{.HOSTED_PROMETHEUS_TOKEN}}
  metrics:
    - metrics-profiles/{{.HC_PRODUCT}}/hosted-cluster-metrics.yml
  alerts:
    - alerts-profiles/{{.HC_PRODUCT}}/hosted-cluster-alerts.yml
  indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
{{- end }}