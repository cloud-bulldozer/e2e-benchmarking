# Hosted control-plane metrics from MC Prometheus
# All metrics from HCP namespace scraped via PodMonitors/ServiceMonitors

# OVN service sync latency
- query: histogram_quantile(0.99, sum(rate(ovnkube_master_network_programming_duration_seconds_bucket{namespace=~"{{.HCP_NAMESPACE}}", kind="service"}[2m])) by (le))
  metricName: serviceSyncLatency

# Etcd metrics
- query: sum(rate(etcd_server_leader_changes_seen_total{namespace=~"{{.HCP_NAMESPACE}}"}[2m]))
  metricName: etcdLeaderChangesRate

- query: histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket{namespace=~"{{.HCP_NAMESPACE}}"}[2m]))
  metricName: 99thEtcdDiskBackendCommitDurationSeconds

- query: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{namespace=~"{{.HCP_NAMESPACE}}"}[2m]))
  metricName: 99thEtcdDiskWalFsyncDurationSeconds

- query: histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket{namespace=~"{{.HCP_NAMESPACE}}"}[5m]))
  metricName: 99thEtcdRoundTripTimeSeconds

- query: delta(etcd_server_slow_apply_total{namespace=~"{{.HCP_NAMESPACE}}"}[2m])
  metricName: etcdSlowApply

- query: delta(etcd_server_slow_read_indexes_total{namespace=~"{{.HCP_NAMESPACE}}"}[2m])
  metricName: etcdSlowRead

- query: histogram_quantile(0.99, sum(rate(etcd_server_apply_duration_seconds_bucket{namespace=~"{{.HCP_NAMESPACE}}", job=~"etcd.*"}[5m])) by(le, op))
  metricName: etcdApplyDurationLatency

- query: sum by (cluster_version)(etcd_cluster_version{namespace=~"{{.HCP_NAMESPACE}}"})
  metricName: etcdVersion
  instant: true

# BEGIN TODO(etcd-disk-tuning): temporary etcd metrics for the Hyperdisk IOPS/throughput
# sizing investigation. Remove everything between the BEGIN/END etcd-disk-tuning
# markers (in this file and mc-metrics.yml) if not needed.
# etcd QPS by gRPC method (Range = reads, Txn/Put/DeleteRange = writes)
- query: sum(rate(grpc_server_handled_total{namespace=~"{{.HCP_NAMESPACE}}",grpc_type="unary"}[2m])) by (grpc_method) > 0
  metricName: etcdGrpcQPS

- query: sum(rate(grpc_server_handled_total{namespace=~"{{.HCP_NAMESPACE}}",grpc_type="unary",grpc_code!="OK"}[2m])) by (grpc_method, grpc_code) > 0
  metricName: etcdGrpcErrors

# Raft proposals
- query: sum(rate(etcd_server_proposals_committed_total{namespace=~"{{.HCP_NAMESPACE}}"}[2m])) by (pod)
  metricName: etcdProposalsCommittedRate

- query: max(etcd_server_proposals_pending{namespace=~"{{.HCP_NAMESPACE}}"}) by (pod)
  metricName: etcdProposalsPending

- query: sum(rate(etcd_server_proposals_failed_total{namespace=~"{{.HCP_NAMESPACE}}"}[2m]))
  metricName: etcdProposalsFailedRate

# etcd requests as seen by kube-apiserver
- query: sum(rate(etcd_requests_total{namespace=~"{{.HCP_NAMESPACE}}",job="kube-apiserver"}[2m])) by (operation, resource) > 0
  metricName: etcdRequestsRate

- query: histogram_quantile(0.99, sum(rate(etcd_request_duration_seconds_bucket{namespace=~"{{.HCP_NAMESPACE}}",job="kube-apiserver"}[2m])) by (le, operation))
  metricName: etcdRequestLatency

- query: max(etcd_mvcc_db_total_size_in_bytes{namespace=~"{{.HCP_NAMESPACE}}"}) by (pod)
  metricName: etcdDBSize
# END TODO(etcd-disk-tuning)

# Cluster version
- query: cluster_version{type="completed", namespace=~"{{.HCP_NAMESPACE}}"}
  metricName: clusterVersion
  instant: true

# API server

- query: irate(apiserver_request_total{namespace=~"{{.HCP_NAMESPACE}}", verb="POST", resource="pods", subresource="binding",code="201"}[2m]) > 0
  metricName: schedulingThroughput

- query: histogram_quantile(0.99, sum(irate(apiserver_request_duration_seconds_bucket{namespace=~"{{.HCP_NAMESPACE}}", job="kube-apiserver", verb=~"LIST|GET", subresource!~"log|exec|portforward|attach|proxy"}[2m])) by (le, resource, verb, scope)) > 0
  metricName: readOnlyAPICallsLatency

- query: histogram_quantile(0.99, sum(irate(apiserver_request_duration_seconds_bucket{namespace=~"{{.HCP_NAMESPACE}}", job="kube-apiserver", verb=~"POST|PUT|DELETE|PATCH", subresource!~"log|exec|portforward|attach|proxy"}[2m])) by (le, resource, verb, scope)) > 0
  metricName: mutatingAPICallsLatency

- query: sum(irate(apiserver_request_total{namespace=~"{{.HCP_NAMESPACE}}", job="kube-apiserver",verb!="WATCH"}[2m])) by (verb,resource,instance) > 0
  metricName: APIRequestRate
